name: Process Jannat report

on:
  workflow_dispatch:
  repository_dispatch:
    types: [telegram_report_received, telegram_network_report_requested]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Download repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install packages
        run: pip install -r requirements.txt

      - name: Prepare report directory
        run: mkdir -p telegram-inputs

      - name: Download network reports
        if: github.event.action == 'telegram_network_report_requested'
        shell: python
        env:
          FILES_JSON: ${{ toJson(github.event.client_payload.files) }}
          DIRECTOR_NOTES_JSON: ${{ toJson(github.event.client_payload.director_notes) }}
        run: |
          import json
          import os
          import pathlib
          import urllib.request

          destination = pathlib.Path("telegram-inputs")
          files = json.loads(os.environ["FILES_JSON"])
          for index, item in enumerate(files):
              safe_name = pathlib.Path(item.get("file_name") or f"report-{index}.xlsx").name
              request = urllib.request.Request(
                  item["download_url"],
                  headers={"User-Agent": "Jannat-GitHub-Actions/1.0"},
              )
              with urllib.request.urlopen(request, timeout=60) as response:
                  (destination / safe_name).write_bytes(response.read())
          pathlib.Path("director-notes.json").write_text(
              os.environ.get("DIRECTOR_NOTES_JSON") or "[]",
              encoding="utf-8",
          )

      - name: Download individual report
        if: github.event.action == 'telegram_report_received'
        env:
          DOWNLOAD_URL: ${{ github.event.client_payload.download_url }}
        run: curl --fail --location "$DOWNLOAD_URL" -o telegram-inputs/telegram-report.xlsx

      - name: Select manual sample
        if: github.event_name == 'workflow_dispatch'
        run: cp sample_input/Jannat_Sales_Daily_Template.xlsx telegram-inputs/manual-report.xlsx

      - name: Generate HTML report
        shell: bash
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLAUDE_MODEL: claude-sonnet-5
        run: |
          mapfile -t FILES < <(find telegram-inputs -name "*.xlsx" -type f | sort)
          ARGS=()
          for FILE in "${FILES[@]}"; do ARGS+=(--input "$FILE"); done
          NOTES=()
          if [ -f director-notes.json ]; then NOTES=(--notes-json director-notes.json); fi
          PYTHONPATH=src python src/process_report.py "${ARGS[@]}" "${NOTES[@]}" \
            --html public/index.html --json public/latest.json

      - name: Upload completed report
        uses: actions/upload-artifact@v4
        with:
          name: jannat-consolidated-report
          path: |
            public/index.html
            public/latest.json

      - name: Return report to Telegram bot
        if: github.event_name == 'repository_dispatch'
        shell: python
        env:
          CALLBACK_URL: ${{ github.event.client_payload.callback_url }}
        run: |
          import base64
          import json
          import os
          import urllib.request
          from pathlib import Path

          html = Path("public/index.html").read_bytes()
          summary = json.loads(Path("public/latest.json").read_text(encoding="utf-8"))
          payload = json.dumps({
              "html_base64": base64.b64encode(html).decode("ascii"),
              "summary": summary,
              "verified": bool(summary.get("verified")),
          }).encode("utf-8")
          request = urllib.request.Request(
              os.environ["CALLBACK_URL"],
              data=payload,
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "Jannat-GitHub-Actions/1.0",
              },
              method="POST",
          )
          with urllib.request.urlopen(request, timeout=60) as response:
              print(response.read().decode("utf-8"))
